name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.go' -not -path './.git/*' -print)
          if (( ${#files[@]} == 0 )); then
            echo 'No Go files found; formatting check passed.'
            exit 0
          fi
          formatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$formatted" ]]; then
            echo "The following Go files are not gofmt-formatted:"
            printf '%s\n' "$formatted"
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests with race detector
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build standard relay
        run: go build -trimpath -buildvcs=true ./...

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No shell scripts found; ShellCheck passed.'
            exit 0
          fi
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Test ADB install fallback
        run: bash tests/adb-install-test.sh

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        working-directory: android-client
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Run Android unit tests
        working-directory: android-client
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android-client
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android-client
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      - name: Build AOA relay
        run: go build -tags aoa ./...

  build-and-release:
    name: Build and publish release assets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        working-directory: android-client
        run: chmod +x gradlew

      - name: Build Android beta APK
        working-directory: android-client
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Android APK
        run: |
          cp android-client/app/build/outputs/apk/debug/app-debug.apk \
            OpenTether-${GITHUB_REF_NAME}-android.apk

      - name: Build Linux relay — amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o OpenTether-${GITHUB_REF_NAME}-linux-amd64 .

      - name: Build Linux relay — arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o OpenTether-${GITHUB_REF_NAME}-linux-arm64 .

      - name: Install libusb for AOA build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      - name: Build Linux AOA relay — amd64
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -tags aoa -o OpenTether-${GITHUB_REF_NAME}-linux-amd64-aoa .

      - name: Generate checksums
        run: sha256sum OpenTether-${GITHUB_REF_NAME}-* > OpenTether-${GITHUB_REF_NAME}-SHA256SUMS.txt

      - name: Determine prerelease status
        id: release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenTether ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: |
            OpenTether-${{ github.ref_name }}-android.apk
            OpenTether-${{ github.ref_name }}-linux-amd64
            OpenTether-${{ github.ref_name }}-linux-arm64
            OpenTether-${{ github.ref_name }}-linux-amd64-aoa
            OpenTether-${{ github.ref_name }}-SHA256SUMS.txt
