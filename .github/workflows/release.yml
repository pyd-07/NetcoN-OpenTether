name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build standard relay
        run: go build ./...

      - name: Install libusb
        run: sudo apt-get install -y libusb-1.0-0-dev

      - name: Build AOA relay
        run: go build -tags aoa ./...

  build-and-release:
    name: Build and publish release assets
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        working-directory: android-client
        run: chmod +x gradlew

      - name: Build Android beta APK
        working-directory: android-client
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Android APK
        run: |
          cp android-client/app/build/outputs/apk/debug/app-debug.apk \
            OpenTether-${GITHUB_REF_NAME}-android.apk

      - name: Build Linux relay — amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o OpenTether-${GITHUB_REF_NAME}-linux-amd64 .

      - name: Build Linux relay — arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o OpenTether-${GITHUB_REF_NAME}-linux-arm64 .

      - name: Install libusb for AOA build
        run: sudo apt-get install -y libusb-1.0-0-dev

      - name: Build Linux AOA relay — amd64
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -tags aoa -o OpenTether-${GITHUB_REF_NAME}-linux-amd64-aoa .

      - name: Generate checksums
        run: sha256sum OpenTether-${GITHUB_REF_NAME}-* > OpenTether-${GITHUB_REF_NAME}-SHA256SUMS.txt

      - name: Determine prerelease status
        id: release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenTether ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: |
            OpenTether-${{ github.ref_name }}-android.apk
            OpenTether-${{ github.ref_name }}-linux-amd64
            OpenTether-${{ github.ref_name }}-linux-arm64
            OpenTether-${{ github.ref_name }}-linux-amd64-aoa
            OpenTether-${{ github.ref_name }}-SHA256SUMS.txt
