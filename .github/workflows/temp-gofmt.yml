name: Temporary Go formatter

on:
  push:
    branches:
      - fix/pr3-ci-failures

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format Go sources
        run: gofmt -w relay/aoa_linux.go relay/nat_linux.go relay/protocol.go relay/session.go relay/tun_linux.go tools/mock_android/main.go

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo 'Go sources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relay/aoa_linux.go relay/nat_linux.go relay/protocol.go relay/session.go relay/tun_linux.go tools/mock_android/main.go
          git commit -m 'chore: gofmt relay sources'
          git push
