name: Pull Request CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting of changed Go files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.go')
          else
            mapfile -t files < <(find . -type f -name '*.go' -not -path './.git/*' -print)
          fi
          if (( ${#files[@]} == 0 )); then
            echo 'No Go files changed; formatting check passed.'
            exit 0
          fi
          formatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$formatted" ]]; then
            echo "The following changed Go files are not gofmt-formatted:"
            printf '%s\n' "$formatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build standard relay
        run: go build -trimpath -buildvcs=true ./...

      - name: Build AOA relay
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev
          go build -trimpath -buildvcs=true -tags aoa ./...

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        working-directory: android-client
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Run unit tests
        working-directory: android-client
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android-client
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android-client
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check changed shell scripts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t scripts < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.sh')
          else
            mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print)
          fi
          if (( ${#scripts[@]} == 0 )); then
            echo 'No shell scripts changed; ShellCheck passed.'
            exit 0
          fi
          shellcheck "${scripts[@]}"

  dependency-review:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@dcd589ca9f7a6ded22e224ca2e288beb6bf9846b # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: true
